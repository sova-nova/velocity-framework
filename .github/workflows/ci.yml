name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Linux, and Windows and macOS since the desktop app runs there too (2026-11-11).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install
        run: uv sync --locked --no-group ocr --no-group app
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: uv run --no-sync ruff check .
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: uv run --no-sync ruff format --check .
      - name: Test
        run: uv run --no-sync pytest
