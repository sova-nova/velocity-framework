name: CI

on:
  push:
    branches: [main]
  pull_request:

# Tests only read the repository (security review L1, 2026-11-12).
permissions:
  contents: read

jobs:
  test:
    # Linux, and Windows and macOS since the desktop app runs there too (2026-11-11).
    # macOS only after a merge to main (2026-11-12): GitHub's macOS runners often keep a
    # pull request waiting for minutes, and macOS isn't a focus yet.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Install
        run: uv sync --locked --no-group ocr --no-group app
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: uv run --no-sync ruff check .
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: uv run --no-sync ruff format --check .
      - name: Test
        # UTF-8 mode, so the tests' own file reads and writes match Linux and macOS on
        # Windows; velocity's code names its encodings itself.
        env:
          PYTHONUTF8: "1"
        run: uv run --no-sync pytest
