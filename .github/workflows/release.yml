# Builds velocity's apps when a version tag is pushed, and attaches them to a GitHub
# Release (decided 2026-11-11): the Linux AppImage, and the Windows installer and portable
# zip. To release: set `version` in pyproject.toml, merge, then
# `git tag v<version> && git push origin v<version>`. Started by hand (Actions → Release →
# Run workflow), it only builds, and keeps the files as run artifacts: a trial build.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # to create the release

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the version
        if: github.ref_type == 'tag'
        run: |
          version="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml"
            exit 1
          fi

  linux:
    needs: check
    # The oldest supported Ubuntu, so the app runs on older Linux systems too (glibc).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Libraries the bundled Qt needs at build time
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libgbm1 libasound2 file desktop-file-utils
      - name: Build the AppImage
        run: packaging/build_appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: velocity-linux
          path: build/velocity-*-x86_64.AppImage
          retention-days: 7

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build the installer and the portable zip
        run: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: velocity-windows
          path: |
            build/velocity-*-windows-setup.exe
            build/velocity-*-windows-portable.zip
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" files/* \
            --title "velocity $GITHUB_REF_NAME" \
            --notes "**Windows:** download \`velocity-*-windows-setup.exe\` and run it (Windows warns about an unknown publisher once: click **More info**, then **Run anyway**). Or the portable zip: unzip it anywhere and open \`velocity.exe\`.

          **Linux:** download \`velocity-*-x86_64.AppImage\`, make it executable, and open it.

          These downloads don't include OCR (scanned or math-heavy PDFs need the install from source). See the README."
