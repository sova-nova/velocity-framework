[project]
name = "velocity"
version = "0.1.0"
description = "A local subject tutor built on Claude, with optional textbook sources and Obsidian session logs."
authors = [
    { name = "sova-nova", email = "damiandalic@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.125,<1",
    "keyring>=25",
    "mcp>=2.3",
    "openai>=2.54,<3",
    "pymupdf>=2.1",
    "starlette>=1.10",
    "uvicorn>=0.54",
]

[project.scripts]
velocity = "velocity.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
app = [
    "pywebview[qt]>=6.2.1",
]
build = [
    "pyinstaller>=6",
]
dev = [
    "httpx>=0.28",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
ocr = [
    "marker-pdf>=2.1.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[tool.uv]
# OCR is part of the default dev environment, so `uv run` keeps it installed.
# CI skips it (`--no-group ocr`); it needs a GPU-less torch download only for real OCR.
# The desktop window (`velocity app`, decided 2026-11-11) is too: CI skips it as well,
# since its tests don't open a window.
default-groups = ["dev", "ocr", "app"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
# Lets the tests import the eval harness in evals/.
pythonpath = ["."]
